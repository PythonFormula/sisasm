[project]
name = "sisasm"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = []
[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
sisasm = "cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["src"]